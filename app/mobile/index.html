<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>Holy-Crap Mobile</title>
<style>
  :root {
    --bg: #070708; --panel: #0f0f11; --panel-2: #151518; --line: #26262b;
    --text: #e9e7e4; --muted: #8b8b93; --orange: #ff6a1a; --orange-dim: #7a3410;
    --cyan: #2ab7c9; --red: #ff3b30;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
  body { min-height: 100vh; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0a0a0bee; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .brand { font-family: var(--mono); font-weight: 700; letter-spacing: .14em; color: var(--orange); font-size: 13px; }
  .live { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); margin-right: 6px; }
  main { padding: 0 0 8px; }
  section[hidden] { display: none; }
  h2 { margin: 0; padding: 16px 16px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  h2 em { font-style: normal; color: var(--orange); }
  .hero { margin: 12px 16px; border: 1px solid var(--line); border-left: 3px solid var(--cyan); background: var(--panel); padding: 14px; }
  .hero.amber { border-left-color: var(--orange); } .hero.red { border-left-color: var(--red); background: #1a0f0d; }
  .hero .big { font-family: var(--mono); font-size: 34px; margin-top: 4px; }
  .hero .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .hero .row { display: flex; gap: 22px; margin-top: 10px; }
  .hero .row b { font-family: var(--mono); font-size: 20px; display: block; }
  .tile { display: grid; grid-template-columns: 5px 1fr auto; gap: 12px; align-items: center; margin: 8px 16px; padding: 12px 14px 12px 0; border: 1px solid var(--line); background: var(--panel); width: calc(100% - 32px); text-align: left; }
  .tile .bar { align-self: stretch; background: var(--cyan); }
  .tile.amber .bar { background: var(--orange); } .tile.red .bar { background: var(--red); }
  .tile .name { font-weight: 600; } .tile .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tile .score { font-family: var(--mono); font-size: 22px; color: var(--cyan); }
  .tile.amber .score { color: var(--orange); } .tile.red .score { color: var(--red); }
  .row-ev { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin: 0 16px; padding: 12px 0; border-bottom: 1px solid #1a1a1e; width: calc(100% - 32px); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
  .g { font-family: var(--mono); font-weight: 700; min-width: 34px; text-align: center; padding: 3px 6px; border: 1px solid currentColor; }
  .g.hi { color: var(--cyan); } .g.mid { color: var(--orange); } .g.lo { color: var(--red); }
  .row-ev .t { font-weight: 600; } .row-ev .m { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row-ev .c { font-family: var(--mono); color: var(--muted); }

  .slab { margin: 12px 16px; border: 1px solid #3a3a42; background: linear-gradient(180deg, #17171b, #0c0c0e); border-radius: 4px; overflow: hidden; }
  .slab-head { display: flex; justify-content: space-between; padding: 8px 12px; background: #0a0a0b; border-bottom: 2px solid var(--orange); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--muted); }
  .slab-head b { color: var(--orange); }
  .slab-body { display: grid; grid-template-columns: 1fr 96px; gap: 12px; padding: 12px; }
  .slab-title { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .slab-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  .grade { text-align: center; border: 1px solid var(--line); background: #0a0a0b; padding: 8px 4px; }
  .grade .n { font-family: var(--mono); font-size: 48px; line-height: 1; font-weight: 700; }
  .grade .t { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
  .grade.hi .n { color: var(--cyan); } .grade.mid .n { color: var(--orange); } .grade.lo .n { color: var(--red); }
  .spec { padding: 0 12px 12px; }
  .spec canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
  .spec-tools { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; } .switch input { accent-color: var(--orange); width: 18px; height: 18px; }
  .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 0 12px 12px; }
  .sub div { font-family: var(--mono); font-size: 11px; }
  .meter { height: 5px; background: #1c1c21; margin-top: 3px; } .meter i { display: block; height: 100%; background: var(--cyan); }
  .meter i.o { background: var(--orange); } .meter i.r { background: var(--red); }
  .panel { margin: 12px 16px; border: 1px solid var(--line); background: var(--panel); }
  .panel h3 { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--muted); border-bottom: 1px solid var(--line); text-transform: uppercase; }
  .panel .in { padding: 10px 12px; }
  .prob { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; margin: 7px 0; font-family: var(--mono); font-size: 11.5px; }
  .prob .meter { margin: 0; height: 8px; }
  .why { margin: 0; padding: 0; list-style: none; } .why li { display: grid; grid-template-columns: 22px 1fr; padding: 7px 0; border-bottom: 1px dashed #222; font-size: 14px; }
  .why li:last-child { border-bottom: 0; } .why .mk { color: var(--orange); font-family: var(--mono); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 16px 8px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); min-height: 52px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; position: relative; overflow: hidden; }
  .btn.pri { border-color: var(--orange); color: var(--orange); } .btn.esc { border-color: #5b1f1b; color: #ff8d86; }
  .btn .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--red); }
  .status { padding: 4px 16px 16px; font-family: var(--mono); font-size: 11.5px; color: var(--cyan); min-height: 28px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: #0a0a0bf2; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: 0; min-height: 56px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 2px solid transparent; }
  nav button[aria-selected="true"] { color: var(--orange); border-top-color: var(--orange); }
  .badge { background: var(--orange); color: #000; border-radius: 9px; padding: 0 6px; margin-left: 6px; font-weight: 700; }
</style>
</head>
<body>
<header><div class="brand">HOLY-CRAP</div><div class="live"><i></i><span id="clock">--:--</span> · DEMO DATA</div></header>
<main>
  <section id="tab-over"></section>
  <section id="tab-alerts" hidden></section>
  <section id="tab-card" hidden></section>
</main>
<nav role="tablist" aria-label="Sections">
  <button role="tab" data-tab="over" aria-selected="true">Overview</button>
  <button role="tab" data-tab="alerts" aria-selected="false">Alerts<span class="badge" id="badge">0</span></button>
  <button role="tab" data-tab="card" aria-selected="false">Specimen</button>
</nav>

<script src="../shared/demo-data.js"></script>
<script src="../shared/specimen.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const gClass = (g) => g >= 8 ? "hi" : g >= 5 ? "mid" : "lo";
const pct = (x) => Math.round(x * 100);
const timeStr = (m) => new Date(Date.now() - m * 60000).toTimeString().slice(0, 5);
const getEv = (id) => EVENTS.find((e) => e.id === id);
let selected = EVENTS[0].id, showHeat = true;

function gStatus(g) {
  const recent = EVENTS.filter((e) => e.group === g.id && e.minsAgo <= 15);
  const bad = recent.filter((e) => e.type !== "healthy").length;
  const avg = recent.length ? recent.reduce((a, e) => a + e.grade, 0) / recent.length : null;
  return { bad, avg, count: recent.length, level: bad >= 3 ? "red" : bad >= 1 ? "amber" : "ok" };
}
function renderOver() {
  const hot = GROUPS.filter((g) => gStatus(g).level === "red");
  const abn = EVENTS.filter((e) => e.type !== "healthy").length;
  const mean = (EVENTS.reduce((a, e) => a + e.grade, 0) / EVENTS.length).toFixed(1);
  const lvl = hot.length ? "red" : abn ? "amber" : "";
  $("#tab-over").innerHTML = `
    <div class="hero ${lvl}"><div class="l">Barn status</div>
      <div class="big">${hot.length ? hot.length + " group" + (hot.length > 1 ? "s" : "") + " in alert" : "All clear"}</div>
      <div class="row"><div><b>${EVENTS.length}</b><span class="l">Specimens</span></div><div><b>${abn}</b><span class="l">Abnormal</span></div><div><b>${mean}</b><span class="l">Mean grade</span></div></div></div>
    <h2>Groups <em>/ ${GROUPS.length}</em></h2>
    ${GROUPS.map((g) => { const s = gStatus(g); return `<button class="tile ${s.level === "ok" ? "" : s.level}" data-g="${g.id}">
      <span class="bar"></span><span><div class="name">${g.name}</div><div class="meta">N=${g.n} · ${s.count} events · ${s.bad} abnormal</div></span>
      <span class="score">${s.avg === null ? "--" : s.avg.toFixed(1)}</span></button>`; }).join("")}`;
  document.querySelectorAll(".tile").forEach((t) => t.onclick = () => {
    const ev = EVENTS.find((e) => e.group === t.dataset.g); if (ev) { selected = ev.id; renderCard(); go("card"); }
  });
}
function renderAlerts() {
  const abn = EVENTS.filter((e) => e.type !== "healthy");
  $("#badge").textContent = abn.length;
  $("#tab-alerts").innerHTML = `<h2>Alerts <em>/ latest first</em></h2>` + EVENTS.map((e) => `
    <button class="row-ev" data-id="${e.id}"><span class="g ${gClass(e.grade)}">${e.grade}</span>
      <span><div class="t">${e.type === "healthy" ? "Normal" : "Suspected " + TYPES[e.type].name}</div>
      <div class="m">${GROUPS.find((g) => g.id === e.group).name} · ${timeStr(e.minsAgo)}</div></span><span class="c">${pct(e.probs[e.type])}%</span></button>`).join("");
  document.querySelectorAll(".row-ev").forEach((r) => r.onclick = () => { selected = r.dataset.id; renderCard(); go("card"); });
}
const meter = (v) => `<div class="meter"><i class="${v >= 8 ? "" : v >= 5 ? "o" : "r"}" style="width:${v * 10}%"></i></div>`;
function renderCard() {
  const e = getEv(selected), g = GROUPS.find((x) => x.id === e.group);
  const order = Object.keys(e.probs).sort((a, b) => e.probs[b] - e.probs[a]);
  const margin = e.probs[order[0]] - e.probs[order[1]];
  const unc = margin < .25 ? "High uncertainty, a person should review" : margin < .5 ? "Moderate uncertainty" : "Low uncertainty";
  $("#tab-card").innerHTML = `
    <div class="slab"><div class="slab-head"><span>SPECIMEN <b>${e.id}</b></span><span>${g.name} · ${timeStr(e.minsAgo)}</span></div>
      <div class="slab-body"><div><div class="slab-title">${e.type === "healthy" ? "Normal dropping" : "Suspected " + TYPES[e.type].name}</div>
        <div class="slab-sub">Confidence ${pct(e.probs[e.type])}%</div><div class="slab-sub">Screening result, not a diagnosis</div></div>
        <div class="grade ${gClass(e.grade)}"><div class="n">${e.grade}</div><div class="t">GRADE</div></div></div>
      <div class="spec"><canvas id="spec" width="360" height="270" role="img" aria-label="Illustrated specimen"></canvas>
        <div class="spec-tools"><label class="switch"><input type="checkbox" id="heat" ${showHeat ? "checked" : ""}> Attention map</label><span>Placeholder image</span></div></div>
      <div class="sub">${[["Color", "color"], ["Consistency", "consistency"], ["Urate cap", "urates"], ["Blood / mucus", "blood"], ["Foam", "foam"]].map(([l, k]) => `<div>${l} ${e.sub[k]}/10${meter(e.sub[k])}</div>`).join("")}</div></div>
    <div class="panel"><h3>Why this result</h3><div class="in">
      ${order.map((k) => `<div class="prob"><span>${TYPES[k].name}</span><div class="meter"><i class="${k === order[0] ? "o" : ""}" style="width:${pct(e.probs[k])}%"></i></div><span>${pct(e.probs[k])}%</span></div>`).join("")}
      <div class="note"><b style="color:var(--cyan)">${unc}.</b></div></div></div>
    <div class="panel"><h3>Evidence</h3><div class="in"><ul class="why">${e.why.map((w, i) => `<li><span class="mk">${String(i + 1).padStart(2, "0")}</span><span>${w}</span></li>`).join("")}</ul></div></div>
    <div class="actions"><button class="btn pri" id="ack">Acknowledge</button><button class="btn" id="fa">False alarm</button><button class="btn esc" id="esc">Hold to escalate<span class="fill" id="fill"></span></button></div>
    <div class="status" id="status" role="status">${e.state === "new" ? "" : e.state}</div>`;
  drawSpecimen($("#spec"), e.type, e.region, showHeat, e.id);
  $("#heat").onchange = (ev) => { showHeat = ev.target.checked; drawSpecimen($("#spec"), e.type, e.region, showHeat, e.id); };
  const set = (s) => { e.state = s; $("#status").textContent = s; };
  $("#ack").onclick = () => set("Acknowledged. The watch has been told.");
  $("#fa").onclick = () => set("Marked as false alarm. Saved as a training label.");
  let t = null, st = 0; const fill = $("#fill"), esc = $("#esc");
  const stop = () => { clearInterval(t); fill.style.width = "0"; };
  esc.onpointerdown = () => { st = Date.now(); t = setInterval(() => { const p = Math.min(1, (Date.now() - st) / 1500); fill.style.width = p * 100 + "%";
    if (p >= 1) { stop(); set("Escalated. Vet and owner contacts would be notified (demo, nothing was sent)."); } }, 30); };
  esc.onpointerup = esc.onpointerleave = esc.onpointercancel = stop;
}
function go(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ["over", "alerts", "card"].forEach((t) => $("#tab-" + t).hidden = t !== tab);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.tab));
renderOver(); renderAlerts(); renderCard();
const tick = () => $("#clock").textContent = new Date().toTimeString().slice(0, 5); tick(); setInterval(tick, 30000);
</script>
</body>
</html>
