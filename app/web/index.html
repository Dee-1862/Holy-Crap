<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy-Crap Console</title>
<style>
  :root {
    --bg: #070708;
    --panel: #0f0f11;
    --panel-2: #151518;
    --line: #26262b;
    --text: #e9e7e4;
    --muted: #8b8b93;
    --orange: #ff6a1a;
    --orange-dim: #7a3410;
    --cyan: #2ab7c9;
    --red: #ff3b30;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  body { display: grid; grid-template-rows: 48px 1fr; min-height: 100vh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #0a0a0b; }
  .brand { font-family: var(--mono); font-weight: 700; letter-spacing: .14em; color: var(--orange); font-size: 13px; }
  .brand span { color: var(--text); }
  .top .sp { flex: 1; }
  .chip { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); padding: 3px 8px; border-radius: 2px; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); margin-right: 6px; }
  .dot.warn { background: var(--orange); }

  /* layout */
  .app { display: grid; grid-template-columns: 250px minmax(0,1fr) 430px; min-height: 0; }
  .col { min-height: 0; overflow: auto; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  h2 { margin: 0; padding: 12px 14px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  h2 em { font-style: normal; color: var(--orange); }

  /* groups rail */
  .group { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px 10px 0; }
  .group:hover, .group[aria-pressed="true"] { background: var(--panel-2); }
  .group .bar { align-self: stretch; background: var(--cyan); }
  .group.amber .bar { background: var(--orange); }
  .group.red .bar { background: var(--red); }
  .group .name { font-weight: 600; }
  .group .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .group .score { font-family: var(--mono); font-size: 18px; color: var(--cyan); }
  .group.amber .score { color: var(--orange); } .group.red .score { color: var(--red); }

  /* center */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
  .kpi { background: var(--panel); padding: 12px 14px; }
  .kpi .v { font-family: var(--mono); font-size: 26px; margin-top: 4px; }
  .kpi .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .kpi .v.o { color: var(--orange); } .kpi .v.c { color: var(--cyan); }
  .banner { margin: 12px 14px; padding: 10px 12px; border: 1px solid var(--orange-dim); border-left: 3px solid var(--orange); background: #1a0f08; font-size: 13px; display: none; }
  .banner.show { display: block; }
  .banner b { color: var(--orange); font-family: var(--mono); letter-spacing: .08em; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); font-weight: 600; padding: 8px 14px; border-bottom: 1px solid var(--line); text-transform: uppercase; position: sticky; top: 0; background: var(--bg); }
  td { padding: 9px 14px; border-bottom: 1px solid #1a1a1e; font-size: 13px; }
  tr.ev { cursor: pointer; }
  tr.ev:hover, tr.ev[aria-selected="true"] { background: var(--panel-2); }
  .mono { font-family: var(--mono); }
  .g { font-family: var(--mono); font-weight: 700; display: inline-block; min-width: 30px; text-align: center; padding: 2px 6px; border: 1px solid currentColor; }
  .g.hi { color: var(--cyan); } .g.mid { color: var(--orange); } .g.lo { color: var(--red); }

  /* card (right) */
  .slab { margin: 12px; border: 1px solid #3a3a42; background: linear-gradient(180deg, #17171b, #0c0c0e); border-radius: 4px; overflow: hidden; }
  .slab-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0a0a0b; border-bottom: 2px solid var(--orange); font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); }
  .slab-head b { color: var(--orange); }
  .slab-body { display: grid; grid-template-columns: 1fr 112px; gap: 12px; padding: 12px; }
  .slab-title { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .slab-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  .grade { text-align: center; border: 1px solid var(--line); background: #0a0a0b; padding: 8px 4px; }
  .grade .n { font-family: var(--mono); font-size: 54px; line-height: 1; font-weight: 700; }
  .grade .t { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
  .grade.hi .n { color: var(--cyan); } .grade.mid .n { color: var(--orange); } .grade.lo .n { color: var(--red); }
  .spec { padding: 0 12px 12px; }
  .spec canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: #000; image-rendering: auto; }
  .spec-tools { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { accent-color: var(--orange); }
  .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; padding: 0 12px 12px; }
  .sub div { font-family: var(--mono); font-size: 11px; }
  .meter { height: 5px; background: #1c1c21; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: var(--cyan); }
  .meter i.o { background: var(--orange); } .meter i.r { background: var(--red); }
  .slab-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }

  .panel { margin: 0 12px 12px; border: 1px solid var(--line); background: var(--panel); }
  .panel h3 { margin: 0; padding: 9px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--muted); border-bottom: 1px solid var(--line); text-transform: uppercase; display: flex; justify-content: space-between; }
  .panel h3 em { color: var(--orange); font-style: normal; }
  .panel .in { padding: 10px 12px; }
  .prob { display: grid; grid-template-columns: 96px 1fr 44px; gap: 8px; align-items: center; margin: 6px 0; font-family: var(--mono); font-size: 11.5px; }
  .prob .meter { margin: 0; height: 8px; }
  .why { margin: 0; padding: 0; list-style: none; }
  .why li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px dashed #222; font-size: 12.5px; }
  .why li:last-child { border-bottom: 0; }
  .why .mk { color: var(--orange); font-family: var(--mono); }
  .why .mk.c { color: var(--cyan); }
  .refs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .refs canvas { width: 100%; height: auto; border: 1px solid var(--line); }
  .refs figcaption { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  figure { margin: 0; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 12px 16px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; position: relative; overflow: hidden; }
  .btn:hover { border-color: var(--orange); }
  .btn.pri { border-color: var(--orange); color: var(--orange); }
  .btn.esc { border-color: #5b1f1b; color: #ff8d86; }
  .btn .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--red); }
  .status { padding: 0 12px 16px; font-family: var(--mono); font-size: 11px; color: var(--cyan); min-height: 24px; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; }
    .col { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    body { grid-template-rows: auto 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .top { flex-wrap: wrap; padding: 8px 12px; height: auto; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">HOLY<span>-</span>CRAP <span>/ CONSOLE</span></div>
  <span class="chip"><span class="dot"></span>SITE <b>DEMO-FARM</b></span>
  <span class="chip"><span class="dot"></span>PI-01 <b>ONLINE</b></span>
  <span class="chip">MODEL <b>v0.1.0-demo</b></span>
  <span class="sp"></span>
  <span class="chip" id="clock">--:--:--</span>
</header>

<main class="app">
  <nav class="col" aria-label="Groups">
    <h2>Groups <em>/ 6</em></h2>
    <div id="groups"></div>
    <div class="note" style="padding:12px 14px">Each group is a physically separate pen or cage section. Detections map to a group, not to a single bird.</div>
  </nav>

  <section class="col" aria-label="Overview">
    <div class="kpis" id="kpis"></div>
    <div class="banner" id="banner" role="status"></div>
    <h2>Specimen feed <em>/ latest first</em></h2>
    <table>
      <thead><tr><th>Time</th><th>Group</th><th>Grade</th><th>Suspected type</th><th>Conf.</th></tr></thead>
      <tbody id="feed"></tbody>
    </table>
  </section>

  <aside class="col" aria-label="Specimen detail">
    <h2>Specimen card</h2>
    <div class="slab" id="slab"></div>
    <div id="detail"></div>
  </aside>
</main>

<script src="../shared/demo-data.js"></script>
<script src="../shared/specimen.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const gClass = (g) => g >= 8 ? "hi" : g >= 5 ? "mid" : "lo";
const pct = (x) => Math.round(x * 100);
const topType = (e) => TYPES[e.type].name;
function timeStr(mins) {
  const d = new Date(Date.now() - mins * 60000);
  return d.toTimeString().slice(0, 8);
}

/* ---------- render ---------- */
let selected = EVENTS[0].id, groupFilter = null, showHeat = true;
const getEv = (id) => EVENTS.find((e) => e.id === id);

function groupStatus(g) {
  const recent = EVENTS.filter((e) => e.group === g.id && e.minsAgo <= 15);
  const bad = recent.filter((e) => e.type !== "healthy").length;
  const ratio = bad / g.n * 100;
  const lastGrades = recent.map((e) => e.grade);
  const avg = lastGrades.length ? lastGrades.reduce((a, b) => a + b, 0) / lastGrades.length : null;
  const level = bad >= 3 ? "red" : bad >= 1 ? "amber" : "ok";
  return { bad, ratio, avg, level, count: recent.length };
}
function renderGroups() {
  $("#groups").innerHTML = GROUPS.map((g) => {
    const s = groupStatus(g);
    const cls = s.level === "ok" ? "" : s.level;
    return `<button class="group ${cls}" data-g="${g.id}" aria-pressed="${groupFilter === g.id}">
      <span class="bar"></span>
      <span><div class="name">${g.name}</div><div class="meta">N=${g.n} · ${s.count} events/15m · ${s.bad} abnormal</div></span>
      <span class="score">${s.avg === null ? "--" : s.avg.toFixed(1)}</span></button>`;
  }).join("");
  document.querySelectorAll(".group").forEach((b) => b.onclick = () => {
    groupFilter = groupFilter === b.dataset.g ? null : b.dataset.g; renderAll();
  });
}
function renderKpis() {
  const abn = EVENTS.filter((e) => e.type !== "healthy" && e.minsAgo <= 60).length;
  const avg = (EVENTS.reduce((a, e) => a + e.grade, 0) / EVENTS.length).toFixed(1);
  const alerting = GROUPS.filter((g) => groupStatus(g).level === "red").length;
  $("#kpis").innerHTML = `
    <div class="kpi"><div class="l">Specimens / hr</div><div class="v">${EVENTS.length}</div></div>
    <div class="kpi"><div class="l">Abnormal / hr</div><div class="v o">${abn}</div></div>
    <div class="kpi"><div class="l">Mean grade</div><div class="v c">${avg}</div></div>
    <div class="kpi"><div class="l">Groups in alert</div><div class="v ${alerting ? "o" : "c"}">${alerting}</div></div>`;
  const b = $("#banner");
  const hot = GROUPS.filter((g) => groupStatus(g).level === "red");
  if (hot.length) { b.classList.add("show"); b.innerHTML = `<b>ALERT</b> &nbsp;${hot.map((g) => g.name).join(", ")} has 3 or more abnormal specimens in 15 minutes. Suggested next step is an on-site check and a vet call if confirmed.`; }
  else b.classList.remove("show");
}
function renderFeed() {
  const rows = EVENTS.filter((e) => !groupFilter || e.group === groupFilter);
  $("#feed").innerHTML = rows.map((e) => `
    <tr class="ev" tabindex="0" data-id="${e.id}" aria-selected="${e.id === selected}">
      <td class="mono">${timeStr(e.minsAgo)}</td><td>${GROUPS.find((g) => g.id === e.group).name}</td>
      <td><span class="g ${gClass(e.grade)}">${e.grade}</span></td>
      <td>${e.type === "healthy" ? "Normal" : "Suspected " + topType(e)}</td>
      <td class="mono">${pct(e.probs[e.type])}%</td></tr>`).join("");
  document.querySelectorAll("tr.ev").forEach((r) => {
    r.onclick = () => { selected = r.dataset.id; renderAll(); };
    r.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); r.click(); } };
  });
}
function meter(v, cls) { return `<div class="meter"><i class="${cls}" style="width:${v * 10}%"></i></div>`; }
function subCls(v) { return v >= 8 ? "" : v >= 5 ? "o" : "r"; }
function renderSlab() {
  const e = getEv(selected), g = GROUPS.find((x) => x.id === e.group), gc = gClass(e.grade);
  const typeLine = e.type === "healthy" ? "Normal dropping" : "Suspected " + topType(e);
  $("#slab").innerHTML = `
    <div class="slab-head"><span>SPECIMEN <b>${e.id}</b></span><span>${g.name} · ${timeStr(e.minsAgo)}</span></div>
    <div class="slab-body">
      <div><div class="slab-title">${typeLine}</div>
        <div class="slab-sub">Confidence ${pct(e.probs[e.type])}% · Model v0.1.0-demo</div>
        <div class="slab-sub">Screening result only, not a diagnosis</div></div>
      <div class="grade ${gc}"><div class="n">${e.grade}</div><div class="t">GRADE</div></div>
    </div>
    <div class="spec"><canvas id="spec" width="360" height="270" role="img" aria-label="Illustrated specimen with attention overlay"></canvas>
      <div class="spec-tools"><label class="switch"><input type="checkbox" id="heat" ${showHeat ? "checked" : ""}> Attention map</label>
      <span>Synthetic placeholder image</span></div></div>
    <div class="sub">${[["Color", "color"], ["Consistency", "consistency"], ["Urate cap", "urates"], ["Blood / mucus", "blood"], ["Foam", "foam"]].map(([l, k]) =>
      `<div>${l} ${e.sub[k]}/10${meter(e.sub[k], subCls(e.sub[k]))}</div>`).join("")}</div>
    <div class="slab-foot">Grade is a provisional score. Sub-grades are illustrative in this demo.</div>`;
  drawSpecimen($("#spec"), e.type, e.region, showHeat, e.id);
  $("#heat").onchange = (ev) => { showHeat = ev.target.checked; drawSpecimen($("#spec"), e.type, e.region, showHeat, e.id); };
}
function renderDetail() {
  const e = getEv(selected);
  const order = Object.keys(e.probs).sort((a, b) => e.probs[b] - e.probs[a]);
  const margin = e.probs[order[0]] - e.probs[order[1]];
  const unc = margin < .25 ? "High uncertainty, a person should review" : margin < .5 ? "Moderate uncertainty" : "Low uncertainty";
  $("#detail").innerHTML = `
    <section class="panel"><h3><span>Explainability <em>/ why this result</em></span></h3><div class="in">
      ${order.map((k) => `<div class="prob"><span>${TYPES[k].name}</span><div class="meter"><i class="${k === order[0] ? "o" : ""}" style="width:${pct(e.probs[k])}%"></i></div><span>${pct(e.probs[k])}%</span></div>`).join("")}
      <div class="note" style="margin-top:8px"><b style="color:var(--cyan)">${unc}.</b> Margin between top two is ${pct(margin)} points.</div></div></section>
    <section class="panel"><h3><span>Evidence</span></h3><div class="in"><ul class="why">
      ${e.why.map((w, i) => `<li><span class="mk ${e.type === "healthy" ? "c" : ""}">${String(i + 1).padStart(2, "0")}</span><span>${w}</span></li>`).join("")}</ul></div></section>
    <section class="panel"><h3><span>Closest reference examples</span></h3><div class="in">
      <div class="refs">${[0, 1, 2].map((i) => `<figure><canvas width="120" height="90" id="ref${i}"></canvas><figcaption>${TYPES[e.type].name} #${i + 1}</figcaption></figure>`).join("")}</div>
      <div class="note" style="margin-top:8px">Placeholders here. In production these come from the labeled training set.</div></div></section>
    <section class="panel"><h3><span>How the grade works</span></h3><div class="in note">
      Grade runs from 1 to 10, where 10 is a textbook-healthy dropping. In this demo it is derived from the model's healthy probability, then reduced when color, moisture, blood or foam cues are abnormal.
      It has not been validated against a veterinary scale. Disease names are suspicions from appearance only, and a lab test confirms a diagnosis.</div></section>
    <div class="actions">
      <button class="btn pri" id="ack">Acknowledge</button>
      <button class="btn" id="fa">False alarm</button>
      <button class="btn esc" id="esc">Hold to escalate<span class="fill" id="fill"></span></button>
    </div>
    <div class="status" id="status" role="status">${e.state === "new" ? "" : e.state}</div>`;
  [0, 1, 2].forEach((i) => drawSpecimen($("#ref" + i), e.type, [.5, .5], false, e.id + "r" + i));
  const set = (s) => { e.state = s; $("#status").textContent = s; };
  $("#ack").onclick = () => set("Acknowledged. The group lead has been notified on the watch.");
  $("#fa").onclick = () => set("Marked as false alarm. Saved as a training label.");
  let t = null, started = 0;
  const fill = $("#fill"), esc = $("#esc");
  const stop = () => { clearInterval(t); fill.style.width = "0"; };
  esc.onpointerdown = () => { started = Date.now(); t = setInterval(() => {
    const p = Math.min(1, (Date.now() - started) / 1500); fill.style.width = p * 100 + "%";
    if (p >= 1) { stop(); set("Escalated. Vet and owner contacts would be notified (demo, nothing was sent)."); } }, 30); };
  esc.onpointerup = esc.onpointerleave = stop;
  esc.onkeydown = (ev) => { if (ev.key === "Enter") set("Hold the button with a pointer to escalate, this prevents accidental presses."); };
}
function renderAll() { renderGroups(); renderKpis(); renderFeed(); renderSlab(); renderDetail(); }
renderAll();
setInterval(() => { $("#clock").textContent = new Date().toTimeString().slice(0, 8); }, 1000);
$("#clock").textContent = new Date().toTimeString().slice(0, 8);
</script>
</body>
</html>
